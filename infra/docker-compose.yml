# Local development stack. Run from the repo root:
#   docker compose -f infra/docker-compose.yml up -d
#
# Today this runs PostgreSQL only. Redis, RabbitMQ, MinIO and the gateway are added in the
# phases that need them (see docs/architecture.md). Every value below has a local-only default,
# so it works with no setup; copy infra/.env.example to infra/.env to override.
name: chronicare

services:
  postgres:
    image: postgres:17-alpine
    container_name: chronicare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_dev_only}
      POSTGRES_DB: postgres
      # Read by postgres/init/01-create-databases.sh (first start only).
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:-core_dev_only}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:-payments_dev_only}
    ports:
      # Loopback only. 5433 because 5432 is commonly taken by another local Postgres.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
    name: chronicare_pgdata
